[package]
name = "fvcs"
version = "0.1.0"
edition = "2021"
description = "FigVCS | version control for Figura avatars"
license = "CC-BY-NC-SA-4.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
similar = "2"
colored = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
