[package]
name = "fvcs"
version = "0.2.0"
edition = "2021"
description = "FigVCS | version control for Figura avatars"
license = "CC-BY-NC-SA-4.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
similar = "2"
colored = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
getrandom = "0.3"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
